

volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13
    restart: always
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    image: galinalody/kittygram_backend
    env_file: .env
    restart: always
    volumes:
      - static:/backend_static
      - media:/app/media 
    depends_on:
      - db
  frontend:
    env_file: .env
    image: galinalody/kittygram_frontend
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static:/frontend_static
  gateway:
    image: galinalody/kittygram_gateway
    env_file: .env
    restart: always
    ports:
      - 9000:80
    volumes:
      - static:/static
      - media:/app/media
    depends_on:
      - backend
      - frontend